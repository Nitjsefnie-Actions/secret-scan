name: secrets

# Gitleaks sweeps the full tree and the full git history on every run,
# catching the credentials GitHub's push protection does not: push
# protection covers provider-recognised patterns only, so an ad-hoc
# token, a session cookie, or a private URL with embedded credentials
# reaches main unremarked.
#
# THE PULL REQUEST RUN IS A REQUIRED MERGE CHECK. The pull_request
# trigger below is load-bearing: the `require-ci-aggregate`
# ruleset requires this job's `gitleaks` context on main,
# so a pull request that introduces a secret this scan detects cannot
# merge. Renaming the job or dropping the pull_request trigger makes
# every future merge strand loudly on a missing required check — by
# design; restore the job, do not edit the ruleset around it.
#
# THE CRON IS STILL THE GATE FOR COMMITS NO WORKFLOW SAW. A push carrying
# [skip ci], or a commit that landed before this workflow existed, never
# started a run; the daily schedule re-answers for the whole history, so
# such a commit is scanned the next morning rather than never.
#
# THE BINARY IS FROZEN BY HAND. action.yml pins v8.30.1 and
# the same release's default rules, both digest-verified, so no run scans
# with a silently changed scanner. Every bump rescans the whole history
# under the new rules, which is the price of the bump.

on:
  push:
    # main only. A branch pushed while its pull request is open would run
    # this a second time against the same SHA.
    branches: [main]
  pull_request:
  schedule:
    # Off the hour, and clear of this repository's other scheduled slots:
    # codeql Wed 03:47 and scorecard Sat 02:23.
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scan reads `git log -p`, so a shallow clone
          # would scan a suffix of history and call the rest clean.
          fetch-depth: 0
          # Nothing here pushes; the job token must not survive the checkout.
          persist-credentials: false

      # The scan is this repository's own action, so a consumer pinning it
      # runs exactly the code this job runs.
      - uses: ./ # zizmor: ignore[self-repository] the action under test, from this checkout

      # A commit whose scope names a workflow fails unless its type is `ci`;
      # only `origin/main..HEAD` is examined, so main's own runs pass.
      - uses: Nitjsefnie-Actions/commit-scopes@645ca8f43b00199cebeed7a5d305b4224e902a60 # v1.0.0

      # Fail a pull request whose head lacks a main commit touching a file a
      # required check reads. Only pull requests and main run it: a manual run
      # of another branch is not a pull request this check judges.
      - uses: Nitjsefnie-Actions/freshness@5edc2a45ff894cf49c5cc8d293bbae0af33507d4 # v1.0.0
        if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
