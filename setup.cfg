# pycodestyle configuration for the lint.yml gate. The gate exists for
# defects (indentation, blank-line, and statement rules); the two knobs
# below keep it that way, each with the measurement that justified it.
#
#   max-line-length — at the default 79 the gate reports only E501 on the
#   tracked Python, 348 findings none of which is a defect (pycodestyle
#   2.15.0, 2026-11-28). 100 is the longest line the tree has, so new
#   lines keep a hard limit while the gate stays defect-oriented.
#
#   ignore — every entry but E402 is pycodestyle's own default ignore
#   list, spelled out because `ignore =` replaces the defaults rather than
#   extending them. No tracked file triggers E402 today (measured with it
#   enabled), so that entry exempts nothing yet.
[pycodestyle]
max-line-length = 100
ignore = E402,E121,E123,E126,E226,E24,E704,W503,W504
