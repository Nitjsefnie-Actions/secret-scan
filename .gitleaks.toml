# The [extend] line is load-bearing: it keeps gitleaks's default rules as
# the gate. An allowlist file that replaces the default rules would
# silently narrow the gate to nothing, so nothing here replaces them.
#
# secret-scan's full history scans clean under this repository's own action
# (the default rules without the allowlists that exempt a file by its path
# alone, gitleaks 8.30.1, 2026-11-28), so no allowlist entry exists.
[extend]
useDefault = true
